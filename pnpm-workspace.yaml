packages:
  - docs
  - docs/typedoc
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  # Must match the Vitest version bundled with vite-plus.
  "@vitest/coverage-v8": 5.0.5
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    # vitepress-plugin-mermaid has not declared VitePress 2 support yet.
    vitepress-plugin-mermaid>vitepress: ">=2.0.0-alpha.0"
