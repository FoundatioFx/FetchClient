name: CI

on:
  push:
    branches:
      - main
      - "release/npm/**"
    tags:
      - "v*"
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to publish to npm and GitHub Packages
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build Reason
        env:
          GIT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: 'echo "ref: $GIT_REF event: $EVENT_NAME"'

      - name: Build Version
        id: version
        env:
          GIT_REF: ${{ github.ref }}
          VERSION_OVERRIDE: ${{ inputs.release_version }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            version="$VERSION_OVERRIDE"
          elif [[ "$GIT_REF" == refs/heads/release/npm/* ]]; then
            version="${GIT_REF#refs/heads/release/npm/}"
          else
            dotnet tool install --global minver-cli --version 7.0.0
            version=$(minver --tag-prefix v)
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid semver version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true

      - name: Check
        run: vp check

      - name: Test
        run: vp test --project unit --coverage

      - name: Set Package Version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: vp pm version "$VERSION" -- --no-git-tag-version --no-git-checks

      - name: Pack
        run: |
          vp pack
          vp pm pack --out "$RUNNER_TEMP/fetchclient.tgz"

      - name: Show Package
        run: tar -xOzf "$RUNNER_TEMP/fetchclient.tgz" package/package.json

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/fetchclient.tgz
          if-no-files-found: error

  # Calls real third-party APIs, so it reports problems without gating publishing.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true

      - name: Integration Tests
        run: vp test --project integration

  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true

      - name: Build Documentation
        run: vp run docs:build

  publish:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/npm/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # No checkout here: npm refuses to run inside the repo because devEngines pins pnpm.
      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: npm-package

      - name: Resolve Dist Tag
        id: dist-tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/npm/') || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$IS_RELEASE" = "true" ] && [[ "$VERSION" != *-* ]]; then
            tag=latest
          else
            tag=next
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Dist tag: $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup npm Registry
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@foundatiofx"

      - name: Publish Release Package
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/npm/') || github.event_name == 'workflow_dispatch'
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm publish fetchclient.tgz --provenance --access public --tag "$DIST_TAG"

      - name: Setup GitHub Packages Registry
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@foundatiofx"

      - name: Push GitHub CI Packages
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="@foundatiofx/fetchclient@$VERSION"
          if npm view "$package" version --registry https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "$package already exists in GitHub Packages; skipping publish."
          else
            npm publish fetchclient.tgz --tag "$DIST_TAG" --access public
          fi
