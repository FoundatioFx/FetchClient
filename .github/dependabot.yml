version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - /
      - /docs
      - /docs/typedoc
    schedule:
      interval: weekly
    # Gives new releases a few days to be vetted before they're proposed.
    cooldown:
      default-days: 3
    # Upgrade the Vite+ toolchain with `vp migrate`, which re-pins these together.
    ignore:
      - dependency-name: vite-plus
      - dependency-name: "@voidzero-dev/vite-plus-core"
      - dependency-name: vitest
      - dependency-name: "@vitest/*"
    groups:
      dependencies:
        update-types:
          - minor
          - patch
